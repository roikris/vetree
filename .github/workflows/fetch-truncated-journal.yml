name: Fetch Truncated Journal Backlog

on:
  workflow_dispatch:
    inputs:
      journal:
        description: 'Exact journal name from the Slack truncation warning line'
        required: true
      days_back:
        description: 'EDAT lookback window in days (match the window that produced the warning, e.g. 30)'
        required: true
        default: '30'

jobs:
  fetch-truncated:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js xml2js ws
        working-directory: .github/workflows

      - name: Run remediation script
        run: node scripts/fetch-truncated-journal.js
        working-directory: .github/workflows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          JOURNAL: ${{ github.event.inputs.journal }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
