name: Enrich Articles with AI

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Never two enrichment runs at once: overlapping workers would write stale attempt counts
concurrency:
  group: enrich-articles
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js @anthropic-ai/sdk ws
        working-directory: .github/workflows

      - name: Run enrichment script
        run: node scripts/enrich-articles.js
        working-directory: .github/workflows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # growth-004: score new articles for the Growth OS recommendations right after enrichment, so the panel only reads
  # cached scores (scoring inside the panel's request budget failed silently 2026-10-14 → 11-06). Runs even when
  # enrichment went red — the articles enriched before the failure still need scores.
  score:
    name: Score Growth OS articles
    needs: enrich
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22: supabase-js needs a native WebSocket (Node 20 has none; the enrich job passes `ws` instead)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Score unscored candidates
        run: npx tsx scripts/score-growth-articles.mts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
