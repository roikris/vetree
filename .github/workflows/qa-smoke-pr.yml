name: PR Smoke Suite

# Every Playwright run costs Vercel Fluid Active CPU (Hobby plan: ~4 h/month). 2026-09-24→10-02,
# re-running the full suite on every push to every PR used ~70 extra CPU-minutes. So:
# - draft PRs don't run the suite: `smoke` FAILS in seconds with "mark ready to run" (a red required
#   check, never a stale pass); marking the PR ready re-runs this and the suite runs once
# - docs-only changes (*.md, docs/**) skip the suite: `smoke` is skipped by its job condition,
#   which GitHub reports as success (a trigger filter would leave the required check pending forever)
# Fail-safe: whenever `scope` can't PROVE docs-only (API error, rate limit, incomplete file list,
# a rename out of code), `smoke` runs the full suite.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Deduplicate runs of the SAME commit (e.g. a push and "ready" for one head). Runs for different
# commits never cancel each other — a delayed older run could otherwise cancel the current head's
# run and then fail its own stale-head check, leaving the head untested. An outdated run is
# stopped by the stale-head check in the Draft gate and again right before the tests; a run that
# overlaps a newer push only in between (or finishes before a same-commit duplicate starts) can
# still run the suite once more — rare, since pushes happen on drafts.
concurrency:
  group: smoke-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      lock_tests: ${{ steps.diff.outputs.lock_tests }}
    steps:
      - name: Does this PR change anything besides docs?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          EXPECTED=$(gh api "$PR" --jq .changed_files)
          # Both sides of a rename: moving code into docs/ is still a code change
          FILES=$(gh api --paginate "$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          LISTED=$(gh api --paginate "$PR/files" --jq '.[].filename' | wc -l | tr -d ' ')
          echo "$FILES"
          # Count non-doc files reading ALL input (grep -q would exit early and SIGPIPE the writer,
          # which pipefail turns into "no code"). Only an exact "0" proves docs-only.
          # The harness's scripts and audit fixtures under docs/harness/ are code (both rename sides
          # are in FILES), so a change to the access audit itself always runs this job.
          NONDOC=$(printf '%s\n' "$FILES" | awk '!/(\.md$|^docs\/)/ || /^docs\/harness\/(.*\.(mjs|sh|js)$|test\/)/ {n++} END {print n+0}')
          # The session-lock tests (harness-003) take minutes: only when init.sh or its tests change
          LOCKT=$(printf '%s\n' "$FILES" | awk '/^docs\/harness\/(init\.sh$|test\/lock\/)/ {n++} END {print n+0}')
          if [ "$LISTED" != "$EXPECTED" ] || [ -z "$FILES" ] || [ "$LOCKT" != "0" ]; then
            echo "lock_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "lock_tests=false" >> "$GITHUB_OUTPUT"
          fi
          # The files API stops at 3000: an incomplete list can't prove docs-only
          if [ "$LISTED" != "$EXPECTED" ] || [ -z "$FILES" ] || [ "$NONDOC" != "0" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: smoke skipped"
          fi

  smoke:
    name: smoke
    needs: scope
    # !cancelled(): a FAILED scope must not skip (= pass) the required check — anything but a proven
    # docs-only result runs the suite; a run cancelled by a newer push stays cancelled
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # The PR's CURRENT draft state, not the event's: a push and "ready for review" seconds apart start
      # two runs, the concurrency group cancels the older (the ready one), and the push event still
      # says draft — trusting it failed the gate with no suite run (2026-10-04, PR #107).
      - name: Draft gate
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")
          HEAD=$(printf '%s' "$PR" | jq -r .head.sha)
          # Only a boolean false runs the suite: true, null, a string or anything unexpected fails closed
          if ! printf '%s' "$PR" | jq -e '.draft == false' >/dev/null; then
            echo "Draft PR (draft=$(printf '%s' "$PR" | jq -c .draft)): smoke not run (saves Vercel CPU). Mark the PR ready for review to run it once."
            exit 1
          fi
          # A run started for an older commit must not stand in for the current head
          if [ "$HEAD" != "$EVENT_SHA" ]; then
            echo "Stale run: it was started for $EVENT_SHA, but the PR head is now $HEAD. Ignore this run — the"
            echo "current head has its own run; if that one is missing, re-run smoke from the run for $HEAD (re-running THIS one fails again)."
            exit 1
          fi
          echo "Ready for review at $HEAD: running the suite"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Access-control audit (infra-001): production's actual privileges (migration 074's report)
      # vs supabase/access.json, exactly — so a new table without its grants fails here, before the
      # code that needs it ships. Self-tests first (offline), so an outage can't skip them. Exit 1
      # (mismatch) and 2 (unverified) both fail. Plain node + fetch, no install, no Vercel CPU.
      # Credentials only in this step; output carries status / error codes and diffs, never keys.
      - name: Access-control audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node docs/harness/harness.mjs acl-selftest
          node docs/harness/harness.mjs acl-audit

      # Session-lock commands (harness-003): offline tests against throwaway git repos — no
      # network, no secrets, no Vercel CPU. Run only when init.sh or the tests change (scope job).
      - name: Session-lock self-test
        if: ${{ needs.scope.outputs.lock_tests != 'false' }}
        run: bash docs/harness/test/lock/selftest.sh

      - name: Poll Vercel for preview URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node - <<'EOF'
          const token = process.env.VERCEL_TOKEN
          const sha = process.env.COMMIT_SHA

          async function poll() {
            for (let i = 0; i < 40; i++) {
              const res = await fetch(
                `https://api.vercel.com/v6/deployments?limit=20&target=preview&meta-githubCommitSha=${sha}`,
                { headers: { Authorization: `Bearer ${token}` } }
              )
              const data = await res.json()
              const dep = (data.deployments || []).find(d => d.state === 'READY')
              if (dep) {
                const url = `https://${dep.url}`
                console.log(`Preview URL ready: ${url}`)
                const { appendFileSync } = await import('fs')
                appendFileSync(process.env.GITHUB_OUTPUT, `preview_url=${url}\n`)
                return
              }
              const building = (data.deployments || [])[0]
              const state = building?.state || 'not found'
              console.log(`[${i + 1}/40] Deployment state: ${state} — waiting 15s`)
              await new Promise(r => setTimeout(r, 15_000))
            }
            console.error('ERROR: Timed out waiting for Vercel preview deployment (10 min)')
            process.exit(1)
          }

          poll()
          EOF

      # Previews are behind Vercel Deployment Protection (they share the production database, so
      # they must not be publicly reachable). Protection must be ON: an anonymous request must be
      # redirected to Vercel's login. CI enters with the automation bypass secret, which
      # e2e/global-setup.ts exchanges (once, preview origin only) for a host-scoped cookie and
      # verifies that the cookie alone opens the preview.
      - name: Check the preview is protected
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "ERROR: VERCEL_AUTOMATION_BYPASS_SECRET is not set in GitHub secrets."
            exit 1
          fi
          read -r CODE LOCATION < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$PREVIEW_URL/")
          case "$CODE" in 301|302|303|307|308) ;; *) CODE_BAD=1 ;; esac
          if [ -n "$CODE_BAD" ] || [[ "$LOCATION" != https://vercel.com/sso-api* ]]; then
            echo "ERROR: preview is not behind Vercel Deployment Protection (HTTP $CODE, redirect '$LOCATION')."
            echo "Previews share the production database; re-enable Standard Protection."
            exit 1
          fi
          echo "Preview is protected (HTTP $CODE → Vercel login)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Re-check right before the tests: a newer push may have landed while this run waited for
      # its preview — don't spend Vercel CPU testing a commit that is no longer the head
      - name: Still the PR head?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)
          if [ "$HEAD" != "$EVENT_SHA" ]; then
            echo "Stale run: the PR head moved to $HEAD while this run (for $EVENT_SHA) was preparing. Tests not run; the head has its own run."
            exit 1
          fi

      - name: Run smoke tests
        id: smoke
        run: npm run test:smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          SMOKE_USER_AGENT: vetree-smoke-pr
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Triage + Slack
        if: always() && steps.draft.outcome == 'success' && steps.head.outcome == 'success'
        run: node scripts/qa-triage.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: pull_request

      - name: Upload Playwright report
        if: always() && steps.draft.outcome == 'success' && steps.head.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

      - name: Fail job if tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
