name: QA Smoke Suite

# Production smoke. Essentials (tests not tagged @weekly) run Mon–Sat; the full suite runs weekly on
# Sunday. After every deploy only a light HTTP health check runs: the merged code already passed the
# full suite on its preview (qa-smoke-pr.yml, the required `smoke` check), and every Playwright run
# costs Vercel Fluid Active CPU (Hobby plan: ~4 h/month; 2026-09-24→10-02 test runs alone used ~70 min).
on:
  schedule:
    - cron: '0 6 * * 1-6'   # Mon–Sat 06:00 UTC — essentials
    - cron: '0 6 * * 0'     # Sunday 06:00 UTC — full suite
  push:
    branches: [main]        # post-deploy — HTTP health check only
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options: [full, essentials]
        default: full

permissions:
  contents: read   # the deploy wait compares commits via the GitHub API

jobs:
  # Deliberately not named `smoke`: that is the PR workflow's required check
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On push: test the release that was just pushed, never the previous one. Poll
      # /api/version until production serves this exact commit (fails after 15 minutes).
      - name: Wait until production serves this commit
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEADLINE=$((SECONDS + 900))   # 15 minutes of wall-clock time, all calls included
          while [ $SECONDS -lt $DEADLINE ]; do
            SERVED=$(curl -s --max-time 10 https://vetree.app/api/version | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "Production serves $EXPECTED_SHA"
              exit 0
            fi
            # A later push already live (it contains this commit): test that instead of waiting forever
            if [ -n "$SERVED" ]; then
              STATUS=$(timeout 20 gh api "repos/${{ github.repository }}/compare/$EXPECTED_SHA...$SERVED" --jq .status 2>&1 || true)
              if [ "$STATUS" = "ahead" ]; then
                echo "Production serves $SERVED, a later commit that includes $EXPECTED_SHA"
                exit 0
              fi
              echo "production serves $SERVED (compare: $STATUS), waiting for $EXPECTED_SHA"
            else
              echo "production version unknown, waiting for $EXPECTED_SHA"
            fi
            sleep 15
          done
          echo "ERROR: production did not serve $EXPECTED_SHA within 15 minutes"
          exit 1

      # Post-deploy: a few plain requests instead of Playwright — home, the version endpoint, a
      # database-backed API, and a real article page taken from the (cached) sitemap.
      - name: Post-deploy health check
        id: health
        if: github.event_name == 'push'
        run: |
          UA='VetreeQABot/1.0 (health check)'   # QA traffic: never recorded in analytics
          fail=0
          fetch() {  # url -> body + "\n<status>"; one retry for transient errors, never aborts the step
            local out
            out=$(curl -s -A "$UA" --max-time 20 -w '\n%{http_code}' "$1" || true)
            if [ "$(printf '%s' "$out" | tail -n1)" != "200" ]; then sleep 5; out=$(curl -s -A "$UA" --max-time 20 -w '\n%{http_code}' "$1" || true); fi
            printf '%s' "$out"
          }
          check() {  # url, then every marker the 200 body must contain
            local url=$1; shift
            local out code m
            out=$(fetch "$url"); code=$(printf '%s' "$out" | tail -n1)
            if [ "$code" != "200" ]; then echo "FAIL $code $url"; fail=1; return; fi
            for m in "$@"; do
              if ! printf '%s' "$out" | grep -qF -- "$m"; then echo "FAIL $url: missing $m"; fail=1; return; fi
            done
            echo "OK   $url"
          }
          # Real page markers, not just a <title> an error page would also have
          check https://vetree.app/ 'data-testid="landing-cta-primary"'
          # (the wait step above already proved this commit — or a later one containing it — is live)
          check https://vetree.app/api/version '"sha":"'
          # The stats route answers 200 with zeros when the database fails: require a real count
          STATS=$(fetch https://vetree.app/api/stats/public | sed '$d')
          COUNT=$(printf '%s' "$STATS" | sed -n 's/.*"articles_count":\([0-9]*\).*/\1/p')
          if [ "${COUNT:-0}" -gt 1000 ]; then echo "OK   /api/stats/public ($COUNT articles)"; else echo "FAIL /api/stats/public: articles_count=${COUNT:-none} ($STATS)"; fail=1; fi
          SITEMAP=$(fetch https://vetree.app/sitemaps/sitemap/0.xml)
          ARTICLE=$(printf '%s' "$SITEMAP" | grep -o 'https://vetree.app/article/[^<]*' | head -n1 || true)
          if [ "$(printf '%s' "$SITEMAP" | tail -n1)" != "200" ] || [ -z "$ARTICLE" ]; then echo "FAIL sitemap: no article URL"; fail=1
          else check "$ARTICLE" 'data-testid="article-title"' 'data-testid="clinical-bottom-line"'; fi
          exit $fail

      # Any post-deploy failure — the release never went live, setup failed, or the health check
      - name: Slack on failed post-deploy check
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🌿 *Vetree* — post-deploy check FAILED for ${GITHUB_SHA:0:7}\\n$RUN_URL\"}" "$SLACK_WEBHOOK_URL" \
            -o /dev/null -w 'Slack HTTP %{http_code}\n' -f || echo "::warning::Slack delivery failed"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        if: github.event_name != 'push'
        run: |
          if [ "$SUITE" = "full" ]; then npm run test:smoke; else npm run test:smoke -- --grep-invert @weekly; fi
        continue-on-error: true
        env:
          SUITE: ${{ (github.event.schedule == '0 6 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) && 'full' || 'essentials' }}
          SMOKE_BASE_URL: https://vetree.app
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Triage + Slack
        if: always() && github.event_name != 'push'
        run: node scripts/qa-triage.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_BASE_URL: https://vetree.app
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          SUITE: ${{ (github.event.schedule == '0 6 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) && 'full' || 'essentials' }}

      - name: Upload Playwright report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Fail job if tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
