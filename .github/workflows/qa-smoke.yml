name: QA Smoke Suite

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On push: test the release that was just pushed, never the previous one. Poll
      # /api/version until production serves this exact commit (fails after 15 minutes).
      - name: Wait until production serves this commit
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            SERVED=$(curl -s --max-time 10 https://vetree.app/api/version | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "Production serves $EXPECTED_SHA"
              exit 0
            fi
            # A later push already live (it contains this commit): test that instead of waiting forever
            if [ -n "$SERVED" ] && [ "$(gh api "repos/${{ github.repository }}/compare/$EXPECTED_SHA...$SERVED" --jq .status 2>/dev/null)" = "ahead" ]; then
              echo "Production serves $SERVED, a later commit that includes $EXPECTED_SHA"
              exit 0
            fi
            echo "[$i/60] production serves '${SERVED:-unknown}', waiting for $EXPECTED_SHA"
            sleep 15
          done
          echo "ERROR: production did not serve $EXPECTED_SHA within 15 minutes"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        run: npm run test:smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: https://vetree.app
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Triage + Slack
        if: always()
        run: node scripts/qa-triage.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_BASE_URL: https://vetree.app
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Fail job if tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
