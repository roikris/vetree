name: QA Smoke Suite

# Production smoke. Essentials (tests not tagged @weekly) run Mon–Sat; the full suite runs weekly on
# Sunday. After every deploy only a light HTTP health check runs: the merged code already passed the
# full suite on its preview (qa-smoke-pr.yml, the required `smoke` check), and every Playwright run
# costs Vercel Fluid Active CPU (Hobby plan: ~4 h/month; 2026-09-24→10-02 test runs alone used ~70 min).
on:
  schedule:
    - cron: '0 6 * * 1-6'   # Mon–Sat 06:00 UTC — essentials
    - cron: '0 6 * * 0'     # Sunday 06:00 UTC — full suite
  push:
    branches: [main]        # post-deploy — HTTP health check only
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options: [full, essentials]
        default: full

permissions:
  contents: read   # the deploy wait compares commits via the GitHub API

jobs:
  # Deliberately not named `smoke`: that is the PR workflow's required check
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On push: test the release that was just pushed, never the previous one. Poll
      # /api/version until production serves this exact commit (fails after 15 minutes).
      - name: Wait until production serves this commit
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEADLINE=$((SECONDS + 900))   # 15 minutes of wall-clock time, all calls included
          while [ $SECONDS -lt $DEADLINE ]; do
            SERVED=$(curl -s --max-time 10 https://vetree.app/api/version | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "Production serves $EXPECTED_SHA"
              exit 0
            fi
            # A later push already live (it contains this commit): test that instead of waiting forever
            if [ -n "$SERVED" ]; then
              STATUS=$(timeout 20 gh api "repos/${{ github.repository }}/compare/$EXPECTED_SHA...$SERVED" --jq .status 2>&1 || true)
              if [ "$STATUS" = "ahead" ]; then
                echo "Production serves $SERVED, a later commit that includes $EXPECTED_SHA"
                exit 0
              fi
              echo "production serves $SERVED (compare: $STATUS), waiting for $EXPECTED_SHA"
            else
              echo "production version unknown, waiting for $EXPECTED_SHA"
            fi
            sleep 15
          done
          echo "ERROR: production did not serve $EXPECTED_SHA within 15 minutes"
          exit 1

      # Post-deploy: a few plain requests instead of Playwright — home, the version endpoint, a
      # database-backed API, and a real article page taken from the (cached) sitemap.
      - name: Post-deploy health check
        id: health
        if: github.event_name == 'push'
        run: |
          UA='VetreeQABot/1.0 (health check)'
          fail=0
          check() {  # url, expected text
            body=$(curl -s -A "$UA" --max-time 20 -w '\n%{http_code}' "$1")
            code=$(printf '%s' "$body" | tail -n1)
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q "$2"; then echo "OK   $code $1"
            else echo "FAIL $code $1 (expected 200 containing '$2')"; fail=1; fi
          }
          check https://vetree.app/ '<title>'
          check https://vetree.app/api/version '"sha"'
          check https://vetree.app/api/stats/public '{'
          ARTICLE=$(curl -s -A "$UA" --max-time 20 https://vetree.app/sitemaps/sitemap/0.xml | grep -o 'https://vetree.app/article/[^<]*' | head -n1)
          if [ -z "$ARTICLE" ]; then echo "FAIL no article URL in sitemap"; fail=1; else check "$ARTICLE" 'data-testid="article-title"'; fi
          exit $fail

      - name: Slack on failed health check
        if: failure() && github.event_name == 'push' && steps.health.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🌿 *Vetree* — post-deploy health check FAILED for ${GITHUB_SHA:0:7}\\n$RUN_URL\"}" "$SLACK_WEBHOOK_URL"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        if: github.event_name != 'push'
        run: |
          if [ "$SUITE" = "full" ]; then npm run test:smoke; else npm run test:smoke -- --grep-invert @weekly; fi
        continue-on-error: true
        env:
          SUITE: ${{ (github.event.schedule == '0 6 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) && 'full' || 'essentials' }}
          SMOKE_BASE_URL: https://vetree.app
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Triage + Slack
        if: always() && github.event_name != 'push'
        run: node scripts/qa-triage.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_BASE_URL: https://vetree.app
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          SUITE: ${{ (github.event.schedule == '0 6 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) && 'full' || 'essentials' }}

      - name: Upload Playwright report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Fail job if tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
